# ตั้งค่า ruff — ตัวตรวจคุณภาพโค้ดที่ CI เรียกใช้ในหัวข้อ 4.3
[tool.ruff]
line-length = 100
 
[tool.ruff.lint]
select = ["E", "F", "I"]   # E = สไตล์ตาม PEP 8 · F = บั๊กที่ตรวจได้โดยไม่ต้องรัน · I = การเรียงลำดับ import
ignore = ["E501"]          # ยกเว้นเรื่องบรรทัดยาว เพราะโค้ดตัวอย่างมีคอมเมนต์ภาษาไทย

# ruff เป็นทั้งตัวตรวจสไตล์และตัวจับบั๊กง่าย ๆ เช่น import ที่ไม่ได้ใช้ ตัวแปรที่ประกาศแล้วไม่ถูกเรียก ทำงานเร็วพอที่จะใส่ไว้เป็นด่านแรกของ CI ได้
# แล็บนี้ไม่ได้เปิดกฎกลุ่ม N (การตั้งชื่อ) ชื่อไฟล์ที่ขึ้นต้นด้วยตัวเลขอย่าง 01_data_validation.py จึงผ่านการตรวจ และตรวจบนเครื่องตัวเองก่อน push ได้ด้วยคำสั่ง ruff check scripts/ tests/

# ถ้าพิมพ์ mlflow แล้วขึ้น 'is not recognized' ให้ใช้ python -m mlflow แทน
# และตรวจว่า pip ลงใน env ที่ activate อยู่จริงด้วย python -m pip -V
